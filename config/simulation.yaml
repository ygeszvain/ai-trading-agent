# Trading agent configuration — SIMULATION profile.
#
# Governing spec: docs/Robinhood_Local_AI_Trading_Build_Plan.md, section 22.
# All money values are quoted strings parsed as Decimal. Percentages are
# fractions of sleeve NAV (0.05 == 5%). Live fields remain inert by default.
#
# Current financial authority: LIVE_NOT_AUTHORIZED.

app:
  environment: development
  mode: simulation                # simulation | paper | shadow | supervised_live | bounded_autonomous_live | paused | reconciliation_required
  display_timezone: America/Chicago
  exchange_timezone: America/New_York
  web_host: "127.0.0.1"           # loopback-only by design
  web_port: 8000                  # must not conflict with LM Studio (default 1234)
  db_url: postgresql+psycopg://trading_agent@127.0.0.1:5433/trading_agent   # loopback-only disposable DB

llm:
  provider: lmstudio              # only provider implemented in v1
  base_url: http://127.0.0.1:1234/v1   # must be loopback; cloud URLs are rejected
  model_id: null                  # owner selects after M2 capability tests
  auth_token_secret_ref: null     # name of a protected secret-store entry; the token itself is read from LM_STUDIO_API_TOKEN
  allow_cloud_fallback: false     # MUST be false in v1 (fail closed)
  max_calls_per_research_job: 4
  max_documents_per_job: 12
  job_timeout_seconds: 120

broker:
  provider: simulator             # simulator | robinhood
  robinhood_mcp_url: https://agent.robinhood.com/mcp/trading
  approved_account_id: null       # owner-controlled alias only; never a raw account number
  allowlisted_tool_schema_digest: null

live:
  enabled: false
  approved_capital_usd: "0"
  owner_authorization_ref: null
  authorization_expires_at: null
  require_application_approval_per_intent: true
  resume_after_restart: false

paper:
  initial_cash_usd: "100000"      # clearly labeled simulated money (plan section 13)
  synthetic_fixture_universe:
    - TEST_A
    - TEST_B
    - TEST_C

universe:
  live_instrument_allowlist: []   # synthetic TEST_* IDs are never valid here
  allow_short_sales: false
  allow_margin_borrowing: false
  allow_options: false
  allow_crypto: false
  allow_leveraged_or_inverse_funds: false
  allow_extended_hours: false
  allow_fractional_orders: false

risk:
  policy_version: paper-policy-v1
  max_position_nav_fraction: "0.05"
  max_gross_nav_fraction: "0.25"
  max_positions: 5
  max_order_nav_fraction: "0.02"
  max_pending_entry_nav_fraction: "0.05"
  min_cash_nav_fraction: "0.75"
  max_planned_daily_turnover_nav_fraction: "0.10"
  daily_loss_pause_nav_fraction: "0.01"
  trailing_drawdown_pause_fraction: "0.05"
  max_entry_spread_bps: "15"
  max_quote_age_seconds: 5
  max_account_state_age_seconds: 10
  max_clock_offset_seconds: 1
  max_participation_fraction: "0.001"
  max_entry_orders_per_session: 10
  entry_cancel_request_after_seconds: 60
  default_order_type: limit
  default_time_in_force: day
  emergency_liquidation_enabled: false   # MUST be false until separately approved and tested

learning:
  enabled: true
  live_auto_promotion_enabled: false     # every live promotion is manual in v1
  max_challenger_trials_per_week: 20
  allowed_live_change_classes: []
  require_matured_labels: true

costs:
  paid_data_budget_usd_per_month: "0"
  allow_paid_subscriptions: false
  operating_cost_reporting_enabled: true

# M1 additions (plan section 22: source/strategy-specific controls are added
# as those modules are implemented). All values are engineering fixtures.
data:
  source: synthetic                 # no network; plan section 8 registry gates real sources later
  fixture_seed: 20260504
  start_session: "2026-05-04"
  sessions: 128
  # Staleness rule for session-granular data: an observation is STALE once it
  # is at least this many sessions old. 1 == "observed in the current session".
  # The TEST_B 2026-08-10/11 gap therefore shows as stale on those two sessions.
  stale_after_sessions: 1
  # Explicit missing/stale scenario for the fixture (website must show it,
  # never fabricate a price): TEST_B has a 2-session gap mid-run.
  missing_scenarios:
    - instrument: TEST_B
      from: "2026-08-10"
      to: "2026-08-11"
  # Named deterministic fixture scenarios (documented in docs/fill_simulation.md):
  #   lost_ack — the first submission of the run loses its acknowledgment and
  #     stays UNKNOWN until end-of-session reconciliation resolves it.
  scenarios:
    - lost_ack

strategy:
  name: trend-momentum
  version: momentum-v1              # rules documented in docs/strategy_momentum_v1.md
  lookback_days: 20
  entry_momentum: "0.05"
  exit_momentum: "0.0"
  target_weight: "0.05"             # equals the paper max-position limit (plan section 13)
  order_slice_weight: "0.02"        # equals the max-single-order limit

research:
  enabled: false               # M2 overlay is opt-in; deterministic runs stay reproducible
  prompt_template: research-v1
  evaluations_per_job: 2       # per research job; must not exceed llm.max_calls_per_research_job
  max_response_chars: 8000
  compare_with_strategy: true  # store the deterministic decision alongside for comparison

engine:
  decision_offset_minutes: 30       # one scheduled decision after the first 30 minutes (plan section 17)
  commission_bps: "0"               # synthetic venue: zero commission
  spread_bps: "5"                   # half-spread embedded in executable limits
  cash_yield_annual: "0.045"        # documented assumption for the cash baseline
  passive_basket:                   # equal-weight buy-and-hold comparison portfolio
    - TEST_A
    - TEST_B
    - TEST_C
