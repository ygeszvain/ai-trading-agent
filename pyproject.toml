[project]
name = "trading-agent"
version = "0.1.0"
description = "Experimental local trading research and simulation application. LIVE_NOT_AUTHORIZED."
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0.2,<7",
    "cryptography>=42.0,<51",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/ygeszvain/ai-trading-agent"
Repository = "https://github.com/ygeszvain/ai-trading-agent"
Issues = "https://github.com/ygeszvain/ai-trading-agent/issues"

[project.scripts]
trading-agent = "trading_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6.0.2",
    "hypothesis>=6.100,<10",
    "playwright>=1.45,<2",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic autogenerate output is machine-written; keep it out of lint/format.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["trading_agent"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
