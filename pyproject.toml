[project]
name = "trading-agent"
version = "0.1.0"
description = "Single-owner local research/trading application. M0 foundation: simulation-only, live trading disabled (LIVE_NOT_AUTHORIZED)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0.2,<7",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6.0.2",
    "hypothesis>=6.100,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["trading_agent"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
