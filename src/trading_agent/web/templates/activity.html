{% extends "base.html" %}
{% block content %}
<div class="filterbar">
  <label>Run: <select data-run-select></select></label>
  <button data-load-more type="button">load more</button>
  <span data-flags-activity class="muted">…</span>
</div>
<div data-activity></div>
<script>
  document.querySelectorAll("[data-run-select]").forEach((el) => {
    TA.api("/api/v1/runs").then((env) => TA.loadRuns(el)).catch(() => {});
  });
</script>
{% endblock %}
