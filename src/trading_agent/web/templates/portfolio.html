{% extends "base.html" %}
{% block content %}
<div class="filterbar">
  <label>Run: <select data-run-select></select></label>
  <span data-flags-portfolio class="muted">…</span>
</div>
<div data-summary class="cards"></div>
<h2>Positions</h2>
<div data-positions></div>
<script>
  document.querySelectorAll("[data-run-select]").forEach((el) => {
    TA.api("/api/v1/runs").then((env) => TA.loadRuns(el)).catch(() => {});
  });
</script>
{% endblock %}
